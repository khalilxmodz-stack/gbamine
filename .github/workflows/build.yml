name: Build GBA ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rom:
    name: Compile MiniMinecraft.gba
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Make sure gbafix is available
        run: |
          [ -x /opt/devkitpro/tools/bin/gbafix ] || dkp-pacman -Sy --noconfirm gba-tools

      - name: Build
        run: make

      - name: Show ROM info
        run: |
          ls -l MiniMinecraft.gba
          echo "Header fixed-value byte (0xB2) should be 96:"
          od -An -tx1 -j178 -N1 MiniMinecraft.gba

      - uses: actions/upload-artifact@v4
        with:
          name: MiniMinecraft-gba
          path: MiniMinecraft.gba

  logic-tests:
    name: PC logic tests + screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: make shots
      - uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: build/shots/*.png
          
